services:
  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
    ports:
      - "5434:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
